<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ambient</title>
    <script>
      // Set the theme before first paint so /dark doesn't flash light.
      if (/^\/dark\/?$/.test(location.pathname)) {
        document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#0b0b0d";
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="ambient">
      <section class="pane calendar-pane">
        <div class="calendar" id="calendar"></div>
      </section>
      <section class="pane clock-pane">
        <time class="clock" id="clock"></time>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
